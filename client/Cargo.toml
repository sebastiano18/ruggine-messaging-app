[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI
eframe = { version = "0.27", features = ["persistence"] }
egui = "0.27"

# Async / rete
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.23"
futures = "0.3"

# JSON & serializzazione
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
anyhow = "1"
thiserror = "1"

