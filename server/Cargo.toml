[package]
name = "server"
version = "0.1.0"
edition = "2021"  # ✅ Corretto (non 2024)

# ✅ AGGIUNGI QUESTA SEZIONE
[lib]
name = "server"  # Nome per gli import
path = "src/lib.rs"

# ✅ AGGIUNGI QUESTA SEZIONE (se vuoi mantenere il binario)
[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum-extra = { version = "0.9", features = ["typed-header"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }
argon2 = "0.5"
headers = "0.4"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.30", features = ["multithread"] }
thiserror = "1"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
dotenvy = "0.15"
rand_core = "0.6.4"
futures = "0.3.31"
http = "1.3.1"
rand = "0.8.5"
chrono = "0.4"
uuid = { version = "1", features = ["serde", "v4"] }
axum = { version = "0.7", features = ["ws", "macros", "json"] }
hyper = "1.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tokio-tungstenite = "0.24.0"
tokio-stream = { version = "0.1", features = ["sync"] }
fastrand = "2.3.0"


[dev-dependencies]
criterion = { version = "0.5.1", features = ["async_tokio"] }

[[bench]]
name = "message_stress_test"
harness = false


[[bench]]
name = "login_stress_test"
harness = false